# Linux desktop packages (Electron): .deb, .rpm, AppImage and Flatpak. Built on a clean Ubuntu runner,
# so the result does not depend on the owner's machine. Signed only when the secret
# LINUX_GPG_PRIVATE_KEY exists (release job; see docs/SIGNING.md); without it the
# release is exactly as before: unsigned, with SHA-256 checksums.
# Why Electron and not Tauri as on Windows: the WebKitGTK of Debian and Ubuntu has no WebRTC,
# and the direct links between devices need it. Run from the Actions tab, or push a tag
# "desktop-v*" to also attach the files to the GitHub release (shared with Windows).
name: Linux desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach to this release (e.g. desktop-v0.7.0); empty = build only'
        required: false
        default: ''
  push:
    tags: ["desktop-v*"]
  # Changes to the Linux package are built and tested before they are merged.
  pull_request:
    paths:
      - "electron/**"
      - "scripts/linux/**"
      - "flatpak/**"
      - "tests/desktop/flatpak.test.ts"
      - "tests/desktop/electron-linux.mjs"
      - ".github/workflows/linux-desktop.yml"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name) || '' }}
  # Where the releases live: this repository, or a separate public one when the source is private
  # (variable RELEASES_REPO, token secret RELEASES_TOKEN; docs/PRIVATE-REPO.md).
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  build:
    # Ubuntu 24.04 restricts unprivileged user namespaces: the installed .deb must still start
    # with the real Chromium sandbox, so this is the platform to test on.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix electron ci

      - name: Unit tests
        run: npx vitest run

      - name: Shell script check
        run: shellcheck -S warning scripts/linux/*.sh

      - name: Build the web app and the packages
        run: |
          npm run build:desktop
          npm --prefix electron run dist

      - name: Collect files and checksums
        env:
          LINUX_REPO_URL: ${{ vars.LINUX_REPO_URL }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./electron/package.json').version")"
          if [ -n "$RELEASE_TAG" ]; then
            case "$RELEASE_TAG" in desktop-v*) ;; *) echo "::error::release tag must start with desktop-v"; exit 1 ;; esac
            [ "${RELEASE_TAG#desktop-v}" = "$version" ] || { echo "::error::tag ${RELEASE_TAG#desktop-v} does not match electron/package.json version $version"; exit 1; }
          fi
          mkdir -p out
          cp electron/release/P2P-Messenger-"$version"-amd64.deb electron/release/P2P-Messenger-"$version"-x86_64.rpm electron/release/P2P-Messenger-"$version"-x86_64.AppImage out/
          cp scripts/linux/install.sh out/install.sh
          # The installer downloads from the releases repository (checksummed below, so edit it first).
          sed -i "s#REPO=\"\${P2P_REPO:-[^}]*}\"#REPO=\"\${P2P_REPO:-$RELEASES_REPO}\"#" out/install.sh
          grep -q "P2P_REPO:-$RELEASES_REPO}" out/install.sh
          # The APT/dnf channel is served from the site; with the source private that is not this repository's Pages.
          if [ -n "$LINUX_REPO_URL" ]; then
            sed -i "s#^REPO_URL=\"\${P2P_REPO_URL:-[^}]*}\"#REPO_URL=\"\${P2P_REPO_URL:-${LINUX_REPO_URL%/}}\"#" out/install.sh
            grep -q "P2P_REPO_URL:-${LINUX_REPO_URL%/}}" out/install.sh
          fi
          (cd out && sha256sum P2P-Messenger-* install.sh > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
          ls -la out
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package metadata
        run: |
          dpkg-deb -I out/*.deb | sed -n 1,20p
          rpm -qp --requires out/*.rpm
          # The app must not ask for more than it needs: no setuid files except the Chromium sandbox.
          dpkg-deb -c out/*.deb | awk '$1 ~ /^-r.s/ {print}' | tee /tmp/suid.txt
          test ! -s /tmp/suid.txt

      - name: Install the .deb and test the installed app (real Chromium sandbox)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ./out/P2P-Messenger-"$VERSION"-amd64.deb
          ls -la "/opt/P2P Messenger/chrome-sandbox"
          APP_BIN="/opt/P2P Messenger/p2p-messenger" OUT_DIR=desktop-test \
            xvfb-run -a -s "-screen 0 1280x900x24" node tests/desktop/electron-linux.mjs

      # Same installed .deb on a real Wayland compositor (headless Weston, no X server for the app).
      - name: Test the installed app on Wayland (headless Weston)
        run: |
          sudo apt-get install -y -qq weston
          env -u DISPLAY APP_BIN="/opt/P2P Messenger/p2p-messenger" OUT_DIR=desktop-test-wayland WAYLAND=1 \
            node tests/desktop/electron-linux.mjs

      # Camera and QR scanner with Chromium's fake camera (flags only on the test command line, none in
      # the app). The video is made by ffmpeg from the invitation QR the app shows. This tests the
      # permission handler, getUserMedia and the QR decoder, not real camera hardware.
      - name: Test camera permission and QR scanner (fake camera)
        run: |
          sudo apt-get install -y -qq ffmpeg
          APP_BIN="/opt/P2P Messenger/p2p-messenger" OUT_DIR=desktop-test-camera FAKE_CAMERA=auto \
            xvfb-run -a -s "-screen 0 1280x900x24" node tests/desktop/electron-linux.mjs

      - name: Install, remove and reinstall with install.sh (checksums, local files)
        run: |
          set -euo pipefail
          sudo apt-get remove -y -qq p2p-messenger
          bash out/install.sh --from-dir out
          dpkg-query -W -f='${Status} ${Version}\n' p2p-messenger | tee /dev/stderr | grep -q "install ok installed $VERSION"
          bash out/install.sh --uninstall
          ! dpkg-query -W -f='${Status}' p2p-messenger 2>/dev/null | grep -q "install ok installed"
          # A file that was changed after the checksums were made must be refused.
          mkdir tampered && cp out/* tampered/ && echo x >> tampered/P2P-Messenger-"$VERSION"-amd64.deb
          if bash out/install.sh --from-dir tampered; then echo "::error::a changed file was installed"; exit 1; fi
          # AppImage path, per user, no root.
          bash out/install.sh --from-dir out --appimage
          test -x "$HOME/.local/bin/p2p-messenger"
          bash out/install.sh --uninstall --dry-run >/dev/null

      # The AppImage cannot be installed setuid. On Ubuntu 24.04 the kernel blocks the user-namespace
      # sandbox for programs without an AppArmor profile, so it may not start there at all. That is a
      # property of the platform, reported here and written down in docs/LINUX.md, not hidden.
      - name: AppImage test (Ubuntu 24.04 may refuse its sandbox)
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 APP_BIN="$PWD/out/P2P-Messenger-$VERSION-x86_64.AppImage" OUT_DIR=desktop-test-appimage \
            xvfb-run -a -s "-screen 0 1280x900x24" node tests/desktop/electron-linux.mjs \
            && echo "::notice title=appimage::the AppImage starts and passes the same checks" \
            || echo "::warning title=appimage::the AppImage did not pass here (userns restricted: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)); use the .deb on Ubuntu 24.04"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p2p-messenger-linux-tests
          path: |
            desktop-test
            desktop-test-appimage
            desktop-test-wayland
            desktop-test-camera
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p2p-messenger-linux-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # Flatpak bundle (org.freedesktop.Platform + Electron2 BaseApp). Runs next to the build job: it
  # makes its own unpacked app from the same locked versions. The manifest has no network
  # source; its only archive is pinned by SHA-256 (scripts/linux/build-flatpak.sh).
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix electron ci

      - name: Unit tests (manifest hardening)
        run: npx vitest run tests/desktop/flatpak.test.ts

      - name: Shell script check
        run: shellcheck -S warning scripts/linux/build-flatpak.sh flatpak/p2p-messenger.sh

      - name: Build the unpacked app
        run: |
          set -euo pipefail
          npm run build:desktop
          npm --prefix electron run dist:dir
          echo "VERSION=$(node -p "require('./electron/package.json').version")" >> "$GITHUB_ENV"

      - name: Install Flatpak tools and the runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Build the .flatpak bundle
        run: bash scripts/linux/build-flatpak.sh out-flatpak

      - name: Check the bundle (metadata and permissions)
        run: |
          set -euo pipefail
          f="out-flatpak/P2P-Messenger-$VERSION-x86_64.flatpak"
          flatpak --user install -y --noninteractive --bundle "$f"
          flatpak info --user --show-permissions bg.p2pmessenger.app | tee /tmp/perms.txt
          ! grep -Ei 'filesystems|session-bus|system-bus|ssh-auth' /tmp/perms.txt
          flatpak --user info --show-metadata bg.p2pmessenger.app | grep -q '^command=p2p-messenger'
          (cd out-flatpak && sha256sum P2P-Messenger-*.flatpak | tee SHA256SUMS-flatpak.txt)

      - name: Start the installed Flatpak (headless X11)
        run: |
          sudo apt-get install -y -qq xvfb
          # A window must appear and the process must stay up for a few seconds.
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            flatpak --user run bg.p2pmessenger.app >/tmp/flatpak-run.log 2>&1 &
            sleep 20
            flatpak --user ps | grep -q bg.p2pmessenger.app
            flatpak --user kill bg.p2pmessenger.app' \
            && echo "::notice title=flatpak::the Flatpak starts and keeps running" \
            || { echo "::warning title=flatpak::the Flatpak did not stay running in CI (see the log)"; tail -40 /tmp/flatpak-run.log || true; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p2p-messenger-linux-flatpak
          path: out-flatpak/*
          if-no-files-found: error
          retention-days: 30

  # The .rpm on a Fedora system: its dependencies must resolve with dnf, and the installed
  # app must start (root in a container, so the Chromium sandbox is switched off here only).
  rpm-fedora:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: p2p-messenger-linux-x64
          path: out
      - name: Install with dnf
        run: |
          dnf install -y nodejs npm xorg-x11-server-Xvfb which
          dnf install -y ./out/*.rpm
          rpm -qi p2p-messenger | head -8
      - name: Test the installed app
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.0
          NO_SANDBOX=1 APP_BIN="/opt/P2P Messenger/p2p-messenger" OUT_DIR=desktop-test-rpm \
            xvfb-run -a -s "-screen 0 1280x900x24" node tests/desktop/electron-linux.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p2p-messenger-linux-rpm-test
          path: desktop-test-rpm
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build, rpm-fedora, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: p2p-messenger-linux-x64
          path: out
      # The Flatpak bundle goes into the same folder, so it is signed with the rest when a key
      # exists (sign-release.sh sums P2P-Messenger-*), and otherwise gets a line in the sums file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: p2p-messenger-linux-flatpak
          path: flatpak-out
      - name: Add the Flatpak bundle to the release files
        run: |
          set -euo pipefail
          cp flatpak-out/P2P-Messenger-*.flatpak out/
          (cd out && sha256sum P2P-Messenger-*.flatpak >> SHA256SUMS-linux.txt && sort -u -k2 SHA256SUMS-linux.txt -o SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
      # Inert until the owner adds the secret. Signs the .rpm, SHA256SUMS-linux.txt (.asc), pins
      # the key fingerprint in install.sh and builds the signed APT + dnf repository metadata
      # (published by pages.yml under <site>/linux/). The key lives only in $RUNNER_TEMP.
      - name: Sign and build the update channel (only with LINUX_GPG_PRIVATE_KEY)
        id: sign
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          REPO_BASE_URL: ${{ vars.LINUX_REPO_URL || format('https://{0}.github.io/{1}/linux', github.repository_owner, github.event.repository.name) }}
        run: |
          set -euo pipefail
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "::notice title=linux-signing::LINUX_GPG_PRIVATE_KEY is not set; packages stay unsigned (SHA-256 only), no APT/dnf repository"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fprs="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="sec"{p=1;next} $1=="fpr"&&p{print $10;p=0}')"
          [ "$(printf '%s\n' "$fprs" | grep -c .)" = 1 ] || { echo "::error::LINUX_GPG_PRIVATE_KEY must hold exactly one secret key"; exit 1; }
          export SIGNING_FPR="$fprs"
          if [ -n "$LINUX_GPG_PASSPHRASE" ]; then
            (umask 077; printf '%s' "$LINUX_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass")
            export GPG_PASSPHRASE_FILE="$RUNNER_TEMP/gpg-pass"
          fi
          bash scripts/linux/sign-release.sh out
          bash scripts/linux/build-repo.sh out repo/linux
          tar -C repo -czf out/p2p-messenger-linux-repo.tar.gz --exclude='*.deb' --exclude='*.rpm' linux
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=linux-signing::signed with $SIGNING_FPR"
      - name: Remove the signing key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/gpg-pass"
      # The repository as users will see it, before it is published: apt on this runner and dnf
      # in Fedora, both through install.sh --add-repo (pinned key, signed metadata) from file://.
      - name: Test the signed repository (apt and dnf)
        if: steps.sign.outputs.signed == 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/p2p-repo && sudo cp -r repo/linux /srv/p2p-repo/ && sudo chmod -R a+rX /srv/p2p-repo
          bash out/install.sh --add-repo --repo-url file:///srv/p2p-repo/linux
          dpkg-query -W -f='${Version}\n' p2p-messenger | grep -qx "${RELEASE_TAG#desktop-v}"
          bash out/install.sh --uninstall
          test ! -e /etc/apt/sources.list.d/p2p-messenger.sources
          docker run --rm -v /srv/p2p-repo:/srv/p2p-repo:ro -v "$PWD/out:/out:ro" fedora:latest \
            bash -c 'bash /out/install.sh --add-repo --repo-url file:///srv/p2p-repo/linux && rpm -q p2p-messenger && rpm -q gpg-pubkey --qf "%{SUMMARY}\n"'
      # The finished (and, with a key, signed) files, for the jobs that publish and check them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p2p-messenger-linux-release
          path: out
          if-no-files-found: error
          retention-days: 7

  # The only job here that can write to the repository. Releases are immutable once published, so
  # files go into a draft, and the draft is published by whichever desktop workflow (this one or
  # Windows) adds its files last. The group serialises the two, so they cannot both create the draft.
  attach:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: p2p-messenger-linux-release
          path: out
      - name: Attach to the draft release, publish when Windows is there too
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: bash scripts/release/desktop-release.sh attach "$RELEASE_TAG" out "${{ github.sha }}" docs/DESKTOP-RELEASE.md

  # Needs the public download links, so it waits for the release to be published.
  release-verify:
    needs: attach
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: p2p-messenger-linux-release
          path: out
      - name: Wait until the release is published (Windows adds its files too)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/desktop-release.sh wait "$RELEASE_TAG" 40
      - name: Install from the release with install.sh
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          bash out/install.sh --version "${RELEASE_TAG#desktop-v}"
          dpkg-query -W -f='${Version}\n' p2p-messenger
          bash out/install.sh --uninstall
