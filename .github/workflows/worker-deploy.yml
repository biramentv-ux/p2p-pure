# Publishes the signalling Worker (short codes, Telegram relay, demo rooms) to Cloudflare.
# Runs on GitHub, so it does not depend on the owner's computer.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers overview page
# Without them the job only runs the Worker tests and says what is missing.
# The Worker's own secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET) stay in Cloudflare
# and are not touched by a deploy.
name: Signalling Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-deploy.yml"]

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Worker tests
        run: npx vitest run tests/worker

      - name: Deploy to Cloudflare
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=worker-deploy::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; tests ran, nothing was deployed (see docs/DEMO-SIGNALING.md)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npx --yes wrangler@4.20.0 deploy 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # Annotations are readable from the API even when logs are not: send the wrangler
            # error lines there (wrangler never prints the API token).
            grep -E "ERROR|✘|error|Authentication|permission|code: [0-9]+" deploy.log | tail -15 | while IFS= read -r line; do
              echo "::error title=wrangler::${line:0:400}"
            done
            exit "$code"
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Check the public endpoints
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          base="https://tg.dyrakarmy.online"
          for i in 1 2 3 4 5 6; do
            body=$(curl -s -m 15 -X POST "$base/ws/rooms" -H 'content-type: application/json' -d '{}' || true)
            if echo "$body" | grep -q '"code"'; then
              echo "::notice title=demo-room::POST /ws/rooms answers: $body"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=demo-room::POST /ws/rooms did not return a room code. Last answer: $body"
          exit 1
