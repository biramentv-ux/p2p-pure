# Java CI with Gradle for the Capacitor Android project.
#
# The Gradle build reads files that Capacitor generates from the npm project:
#   - android/capacitor.settings.gradle points at ../node_modules/@capacitor/android
#   - android/app/capacitor.build.gradle needs capacitor-cordova-android-plugins/
# So both jobs install npm dependencies, build the web app, and run `cap sync`
# before Gradle. The project targets Java 21 (see capacitor.build.gradle).

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Build web app and sync Capacitor Android project
      run: |
        npm run build
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Build with Gradle Wrapper
      working-directory: android
      run: |
        set -o pipefail
        ./gradlew build --stacktrace 2>&1 | tee gradle-build.log

    # When the build fails, put the tail of the Gradle output in the run summary
    # and the key error lines in annotations, so the cause is visible without the raw log.
    - name: Report Gradle failure
      if: failure()
      working-directory: android
      run: |
        {
          echo "### Gradle build failed"
          echo '```'
          tail -n 150 gradle-build.log 2>/dev/null || echo "(no Gradle output was captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        grep -E "What went wrong|error:|Execution failed|Could not " -A2 gradle-build.log 2>/dev/null \
          | head -20 \
          | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
        # Lint writes its own report; surface its error lines too.
        for report in $(find . -path "*build/reports/lint*" -name "*.txt" 2>/dev/null); do
          echo "### Lint report: $report" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Error:|Fatal:" "$report" 2>/dev/null | head -40 >> "$GITHUB_STEP_SUMMARY"
          grep -E "Error:|Fatal:" "$report" 2>/dev/null | head -40 \
            | while IFS= read -r line; do printf '::error::LINT %s\n' "$line"; done
        done

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Build web app and sync Capacitor Android project
      run: |
        npm run build
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        build-root-directory: android
