# Publishes the site to GitHub Pages: https://biramentv-ux.github.io/p2p-pure/
# The landing page (menu, downloads, info) is at "/", the messenger at "/app/" (scripts/site/build.mjs).
# Always online, independent of the owner's computer and of any Cloudflare credentials.
#
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push to main publishes the new build.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A finished release may carry a new signed Linux update channel (<site>/linux/), and every
  # release adds files the download buttons should offer (the page is rebuilt with the newest ones).
  workflow_run:
    workflows: ["Linux desktop", "Windows desktop", "Android APK"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a release workflow only when it succeeded on a release (tag or manual run), not on PRs.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Passkeys in the iOS app: the domain must name the app as "<Team ID>.<bundle id>"
      # (docs/IOS.md). Variable APPLE_TEAM_ID = the 10 characters of the Apple Developer team.
      - name: Apple Team ID in apple-app-site-association
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ]; then
            [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID must be 10 letters/digits"; exit 1; }
            sed -i "s/TEAMID\./${APPLE_TEAM_ID}./" public/.well-known/apple-app-site-association
            grep -q "\"${APPLE_TEAM_ID}\.bg\.p2pmessenger\.app\"" public/.well-known/apple-app-site-association
          fi

      - name: Build the app (/app/) and the site (/)
        env:
          # "/" when the site is served from its own domain (scripts/windows/point-domain-to-pages.ps1
          # sets the variable PAGES_BASE); otherwise the project path.
          PAGES_BASE: ${{ vars.PAGES_BASE || '/p2p-pure/' }}
          # Public GIPHY client key (Settings -> Secrets and variables -> Actions -> Variables).
          # Empty: the GIF button is hidden.
          VITE_GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY }}
          # Only to read the public releases list without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          # Private source (docs/PRIVATE-REPO.md): releases come from this public repository, and
          # SOURCE_CLOSED=1 drops the "open source" wording. Both empty: nothing changes.
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          SOURCE_CLOSED: ${{ vars.SOURCE_CLOSED }}
        run: node scripts/site/build.mjs --build --base "$PAGES_BASE"

      # The signed APT + dnf repository from the newest signed desktop release, next to the web
      # app (Pages serves one artifact, so the channel must be part of it). No key here: the
      # metadata was signed in the release job. Without a signed release this does nothing.
      - name: Linux update channel (<site>/linux/)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: bash scripts/linux/assemble-pages-repo.sh dist/linux

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.PAGES_PUBLISH_REPO == ''
        with:
          path: dist

      # Private source: Pages of a private repository needs a paid plan, so the finished site goes
      # to a public repository instead (job "publish"). Hidden files (.nojekyll, .well-known) are kept.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: vars.PAGES_PUBLISH_REPO != ''
        with:
          name: site-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: vars.PAGES_PUBLISH_REPO == ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Private source only (variable PAGES_PUBLISH_REPO = "owner/public-repo", secret RELEASES_TOKEN with
  # contents:write there). The site is one orphan commit on the branch gh-pages of that repository; set
  # its Pages source to "Deploy from a branch: gh-pages". Nothing from the private repository is
  # published except the built site, which is public anyway.
  publish:
    needs: build
    if: vars.PAGES_PUBLISH_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site
      - name: Push to gh-pages of the public repository
        env:
          TARGET: ${{ vars.PAGES_PUBLISH_REPO }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          [[ "$TARGET" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::PAGES_PUBLISH_REPO must be owner/repo"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::secret RELEASES_TOKEN is not set"; exit 1; }
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          [ -z "$DOMAIN" ] || printf '%s\n' "$DOMAIN" > site/CNAME
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::12}"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push --force "https://github.com/$TARGET.git" gh-pages
