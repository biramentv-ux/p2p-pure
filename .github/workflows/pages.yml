# Publishes the web app to GitHub Pages: https://biramentv-ux.github.io/p2p-pure/
# Always online, independent of the owner's computer and of any Cloudflare credentials.
#
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push to main publishes the new build.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # "/" when the site is served from its own domain (scripts/windows/point-domain-to-pages.ps1
          # sets the variable PAGES_BASE); otherwise the project path.
          BASE_PATH: ${{ vars.PAGES_BASE || '/p2p-pure/' }}
          # Public GIPHY client key (Settings -> Secrets and variables -> Actions -> Variables).
          # Empty: the GIF button is hidden.
          VITE_GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
