# Publishes the web app to GitHub Pages: https://biramentv-ux.github.io/p2p-pure/
# Always online, independent of the owner's computer and of any Cloudflare credentials.
#
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push to main publishes the new build.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build for /p2p-pure/
        env:
          BASE_PATH: /p2p-pure/
          # Public GIPHY client key (Settings -> Secrets and variables -> Actions -> Variables).
          # Empty: the GIF button is hidden.
          VITE_GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
