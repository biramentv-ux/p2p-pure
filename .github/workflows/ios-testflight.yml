# iOS: builds the Capacitor app on a macOS runner and, with the Apple secrets set, signs it and
# uploads it to TestFlight (App Store Connect). Guide and one-time setup: docs/IOS.md.
#
# Without the secrets it only checks that the project compiles (unsigned), so a broken iOS
# project is noticed without an Apple account. macOS minutes cost more than Linux ones, so this
# runs on a tag ios-vX.Y.Z, by hand, or when the iOS project itself changes.
name: iOS

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-testflight.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Secrets are never printed. Missing: the job stops after the unsigned compile check.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version and build number
        run: |
          # ios-v1.2.3 -> 1.2.3; otherwise the version of package.json. The build number must grow
          # with every upload to App Store Connect: the run number does.
          case "$GITHUB_REF_NAME" in
            ios-v[0-9]*.[0-9]*.[0-9]*) version="${GITHUB_REF_NAME#ios-v}" ;;
            *) version="$(node -p "require('./package.json').version")" ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got $version"; exit 1; }
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build the web app and sync it into the iOS project
        env:
          # Same RP ID as the website and the Associated Domains entitlement (ios/App/App/App.entitlements).
          VITE_PASSKEY_RP_ID: ${{ vars.PASSKEY_RP_ID || 'dyrakarmy.online' }}
          VITE_GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY }}
        run: |
          npm run build
          npx cap sync ios

      - name: Compile check (unsigned)
        if: env.ASC_KEY_ID == '' || env.ASC_ISSUER_ID == '' || env.ASC_KEY_P8_BASE64 == '' || env.APPLE_TEAM_ID == ''
        working-directory: ios/App
        run: |
          xcodebuild build -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS= \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Archive, sign and upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8_BASE64 != '' && env.APPLE_TEAM_ID != '' && github.event_name != 'pull_request'
        working-directory: ios/App
        run: |
          # The API key lets xcodebuild create/refresh the distribution certificate and the profile
          # (automatic signing in the cloud), so no certificate or profile is stored as a secret.
          key_dir="$RUNNER_TEMP/asc"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          trap 'rm -rf "$key_dir"' EXIT

          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key_path"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${auth[@]}"

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          # destination=upload: the archive is signed and sent to App Store Connect in one step.
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${auth[@]}"
