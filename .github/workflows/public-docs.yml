# Private source (docs/PRIVATE-REPO.md): the files a visitor of the public releases repository needs
# are copied there, so no link on the site or in a release points into this private repository.
#
#   LICENSE, LICENSE.bg.md, SECURITY.md, SECURITY.bg.md   -> root of the public repository
#   docs/WINDOWS.md, docs/LINUX.md, docs/SIGNING.md        -> docs/ of the public repository
#   docs/public/README.md                                  -> README.md of the public repository
#   docs/public/assets/*                                   -> assets/ (promo videos for the README)
#
# It also rewrites the notes of already published releases that still link to this repository.
# Needs the variable RELEASES_REPO and the secret RELEASES_TOKEN (Contents: Read and write on the
# public repository), the same ones the releases and the site use. Without them it does nothing.
name: Public docs

on:
  push:
    branches: [main]
    paths:
      - LICENSE
      - LICENSE.bg.md
      - SECURITY.md
      - SECURITY.bg.md
      - docs/WINDOWS.md
      - docs/LINUX.md
      - docs/SIGNING.md
      - docs/public/**
      - .github/workflows/public-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-docs
  cancel-in-progress: false

jobs:
  sync:
    if: vars.RELEASES_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      - name: Copy the public files to the releases repository
        env:
          TARGET: ${{ vars.RELEASES_REPO }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE: ${{ github.repository }}
        run: |
          [[ "$TARGET" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::RELEASES_REPO must be owner/repo"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::secret RELEASES_TOKEN is not set"; exit 1; }
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch main "https://github.com/$TARGET.git" pub
          mkdir -p pub/docs
          cp src/LICENSE src/LICENSE.bg.md src/SECURITY.md src/SECURITY.bg.md pub/
          cp src/docs/WINDOWS.md src/docs/LINUX.md src/docs/SIGNING.md pub/docs/
          cp src/docs/public/README.md pub/README.md
          # the promo videos and their previews, linked from the README
          mkdir -p pub/assets && cp src/docs/public/assets/* pub/assets/
          # links into the private repository would be a 404 for everyone else
          sed -i -e "s#github.com/${SOURCE}/releases#github.com/${TARGET}/releases#g" \
                 -e "s#github.com/${SOURCE}/blob/main/#github.com/${TARGET}/blob/main/#g" \
                 pub/*.md pub/docs/*.md
          if grep -rn "github.com/${SOURCE}[/)]" pub/*.md pub/docs/*.md; then
            echo "::warning title=public-docs::the lines above still point into the private repository"
          fi
          cd pub
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Docs from ${SOURCE}@${GITHUB_SHA::12}"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin main

      - name: Point old release notes at the public copies
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TARGET: ${{ vars.RELEASES_REPO }}
          SOURCE: ${{ github.repository }}
        run: |
          gh api "repos/$TARGET/releases" --paginate --jq '.[] | select(.body // "" | contains("github.com/'"$SOURCE"'/")) | .id' |
          while read -r id; do
            gh api "repos/$TARGET/releases/$id" --jq '.body' |
              sed -e "s#github.com/${SOURCE}/blob/#github.com/${TARGET}/blob/#g" \
                  -e "s#github.com/${SOURCE}/releases#github.com/${TARGET}/releases#g" > body.md
            gh api -X PATCH "repos/$TARGET/releases/$id" -F "body=@body.md" > /dev/null
            echo "release $id: notes now link to $TARGET"
          done
