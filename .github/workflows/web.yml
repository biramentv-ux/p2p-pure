name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: node scripts/security/scan-secrets.mjs

      - name: Lint
        run: npm run lint

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts/windows -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Output "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            # Windows PowerShell 5.1 reads BOM-less files as ANSI and breaks Cyrillic text.
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              if ((Get-Content $f.FullName -Raw) -match '[Ѐ-ӿ]') { Write-Output "::error file=$($f.FullName)::Cyrillic text needs a UTF-8 BOM for Windows PowerShell 5.1"; $bad++ }
            }
            Write-Output "$($f.Name): $($errors.Count) parse error(s)"
          }
          if ($bad) { exit 1 }

      - name: Linux install script (shellcheck)
        run: shellcheck -S warning scripts/linux/install.sh

      - name: Unit and worker tests
        # The github-actions reporter turns each failing test into an annotation (logs are not always readable).
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=github-actions 2>&1 | tee vitest.log

      - name: Show why the tests failed
        if: failure()
        shell: bash
        run: |
          # Errors outside a test (unhandled rejections, a crashed worker) get no annotation of their own.
          sed 's/\x1b\[[0-9;]*m//g' vitest.log > plain.log
          { grep -nE -A25 "FAIL |Unhandled" plain.log || true; grep -nE "Tests +[0-9]|Test Files" plain.log || true; } | head -120 | while IFS= read -r line; do
            echo "::error title=vitest::${line//%/%25}"
          done

      - name: Build (type check + PWA)
        run: npm run build

      - name: Pack Chrome extension
        run: npm run extension:pack

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
