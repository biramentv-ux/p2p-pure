# Android emulator QA: builds the debug APK, boots an API 34 emulator (KVM) and drives
# the app WebView over Chrome DevTools (adb forward) with tests/mobile/android-emulator.mjs.
# WebView debugging is on only in debug builds (Capacitor defaults it to BuildConfig.DEBUG).

name: Android emulator QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'src/platform/**'
      - '.github/workflows/android-emulator.yml'
      - 'tests/mobile/android-emulator.mjs'

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Build web app and sync Capacitor Android project
      run: |
        npm run build
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Build debug APK
      working-directory: android
      run: ./gradlew assembleDebug --stacktrace

    - name: Run emulator checks
      uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        disable-animations: true
        script: |
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          node tests/mobile/android-emulator.mjs

    - name: Upload screenshots and results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: android-emulator-artifacts
        path: emulator-artifacts/
        if-no-files-found: warn
