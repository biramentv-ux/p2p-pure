# Android APK: a release build (not debuggable) that can be installed straight on a phone.
#
# Run it from the Actions tab. With "release_tag" empty the APK is only a downloadable run
# artifact; with a tag (android-v0.7.0) it is also attached to a GitHub release (created on the
# built commit when missing), so the file has a stable link.
#
# Signing: with the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD (docs/ANDROID-APK.md) the APK is signed with the owner's key, so
# later builds update the installed app. Without them a one-off key is generated for this run:
# the APK installs and works, but the next build has another key and Android asks to
# uninstall first. The SHA-256 of the signing certificate is printed in the run summary.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach to this release (e.g. android-v0.7.0); empty = run artifact only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check the release tag
        if: env.RELEASE_TAG != ''
        run: |
          case "$RELEASE_TAG" in android-v*) ;; *) echo "::error::release tag must start with android-v"; exit 1 ;; esac

      - name: Install, build the web app, sync the Android project
        env:
          # The WebView runs on localhost; Credential Manager needs the real domain that serves
          # /.well-known/assetlinks.json with this APK's signing fingerprint.
          VITE_PASSKEY_RP_ID: ${{ vars.PASSKEY_RP_ID || 'dyrakarmy.online' }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"; alias="$KEY_ALIAS"; keypass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "owner=true" >> "$GITHUB_OUTPUT"
          else
            pass="$(openssl rand -hex 24)"; alias="p2p"; keypass="$pass"
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass "$pass" -keypass "$keypass" \
              -alias "$alias" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=P2P Messenger one-off build"
            echo "owner=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$ks"
            echo "ANDROID_KEYSTORE_PASSWORD=$pass"
            echo "ANDROID_KEY_ALIAS=$alias"
            echo "ANDROID_KEY_PASSWORD=$keypass"
          } >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        run: |
          version="$(node -p "require('../electron/package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./gradlew assembleRelease --stacktrace -PapkVersionName="$version" -PapkVersionCode="${{ github.run_number }}"

      - name: Verify the APK (signature, not debuggable, no backup, permissions)
        run: |
          set -euo pipefail
          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee verify.txt
          "$bt/aapt2" dump badging "$apk" > badging.txt
          grep -q "package: name='bg.p2pmessenger.app'" badging.txt
          if grep -q "application-debuggable" badging.txt; then echo "::error::APK is debuggable"; exit 1; fi
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          if grep -Eq 'allowBackup.*=\(type 0x12\)0xffffffff' manifest.txt; then echo "::error::allowBackup is on"; exit 1; fi
          # Only the permissions the app declares, nothing added by a dependency.
          grep -o "uses-permission: name='[^']*'" badging.txt | sort > perms.txt
          cat perms.txt
          # USE_BIOMETRIC / USE_FINGERPRINT come from androidx.credentials (passkey prompt);
          # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is androidx.core's own, scoped to this app.
          allowed="CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION INTERNET USE_BIOMETRIC USE_FINGERPRINT BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_SCAN BLUETOOTH_ADVERTISE BLUETOOTH_CONNECT"
          while read -r line; do
            name="${line#*name=\'}"; name="${name%\'}"
            short="${name##*.}"
            if [ "$name" = "bg.p2pmessenger.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" ]; then continue; fi
            case " $allowed " in *" $short "*) ;; *) echo "::error::unexpected permission $name"; exit 1 ;; esac
          done < perms.txt
          mkdir -p out
          cp "$apk" "out/P2P-Messenger-$VERSION-android.apk"
          (cd out && sha256sum "P2P-Messenger-$VERSION-android.apk" > SHA256SUMS-android.txt)
          fp="$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          {
            echo "### Android APK $VERSION (build ${{ github.run_number }})"
            echo "- signing certificate SHA-256: \`$fp\`"
            if [ "${{ steps.key.outputs.owner }}" = "true" ]; then echo "- signed with the owner's key"; else echo "- signed with a ONE-OFF key: the next build cannot update this install (see docs/ANDROID-APK.md)"; fi
            echo "- $(cat out/SHA256SUMS-android.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "FINGERPRINT=$fp" >> "$GITHUB_ENV"

      # Handed to the next job through the Actions cache, not an artifact: artifacts count against
      # the account's storage quota, and a full quota stopped every release (as with pages.yml).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: p2p-messenger-android-apk-${{ github.run_id }}

  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: p2p-messenger-android-apk-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Attach to the release
        env:
          # The releases live here: this repository, or a separate public one when the source is
          # private (variable RELEASES_REPO, token secret RELEASES_TOKEN; docs/PRIVATE-REPO.md).
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          GH_REPO: ${{ vars.RELEASES_REPO || github.repository }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          case "$RELEASE_TAG" in android-v*) ;; *) echo "::error::release tag must start with android-v"; exit 1 ;; esac
          # Releases in this repository are immutable once published: files can only be added
          # while the release is a draft. So: draft -> upload -> publish.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::release $RELEASE_TAG is already published (immutable); use a new tag"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # a commit of the source repository cannot be the target in another repository
            target=(--target "${{ github.sha }}")
            [ "$GH_REPO" = "$SOURCE_REPO" ] || target=()
            gh release create "$RELEASE_TAG" --draft ${target[@]+"${target[@]}"} --title "P2P Messenger for Android $RELEASE_TAG" --prerelease \
              --notes "Android APK. Install: allow installing from this source, open the .apk. SHA-256 is in SHA256SUMS-android.txt. See docs/ANDROID-APK.md."
          fi
          gh release upload "$RELEASE_TAG" out/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
