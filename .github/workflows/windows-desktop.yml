# Windows desktop package (Tauri 2). Builds on a clean Windows runner, so the result does
# not depend on the owner's machine. Unsigned for now: Windows SmartScreen will warn once
# (see docs/WINDOWS.md). Run it from the Actions tab, or push a tag "desktop-v*" to also
# attach the files to a GitHub release.
name: Windows desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this release (e.g. desktop-v0.7.0); empty = build only'
        required: false
        default: ''
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

# The release tag comes from a pushed desktop-v* tag, or from the manual input above
# (then GitHub creates the tag on the built commit when the release is made).
env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Build installer (NSIS, per-user, no admin)
        run: npx tauri build --bundles nsis

      - name: Collect installer and portable zip
        shell: pwsh
        run: |
          $out = "out"
          New-Item -ItemType Directory -Force $out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "$out/P2P-Messenger-Setup-x64.exe"
          # Portable: the app's own exe, which carries the whole web app inside it.
          $portable = "portable/P2P-Messenger"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item src-tauri/target/release/p2p-messenger.exe "$portable/P2P Messenger.exe"
          Copy-Item docs/WINDOWS-PORTABLE.txt "$portable/README.txt"
          Compress-Archive -Path $portable -DestinationPath "$out/P2P-Messenger-portable-x64.zip"
          Get-ChildItem $out | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii "$out/SHA256SUMS.txt"
          }
          Get-Content "$out/SHA256SUMS.txt"

      - name: Smoke test (silent install, start, screenshot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -Wait -FilePath "out/P2P-Messenger-Setup-x64.exe" -ArgumentList "/S"
          $dir = Join-Path $env:LOCALAPPDATA "P2P Messenger"
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::installed exe not found in $dir"; Get-ChildItem $env:LOCALAPPDATA | Out-String | Write-Output; exit 1 }
          Write-Output "::notice title=installed::$($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { Write-Output "::error::app exited early, code $($p.ExitCode)"; exit 1 }
          Write-Output "::notice title=running::pid $($p.Id), window '$($p.MainWindowTitle)'"
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public struct RECT { public int Left, Top, Right, Bottom; }
          public static class Win { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
                                     [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); }
          "@
          [Win]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $r = New-Object RECT
          [Win]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
          $w = $r.Right - $r.Left; $h = $r.Bottom - $r.Top
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $bmp.Size)
          $small = New-Object System.Drawing.Bitmap $bmp, ([int]($w/2)), ([int]($h/2))
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          foreach ($q in 55, 40, 25) {
            $params = New-Object System.Drawing.Imaging.EncoderParameters 1
            $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), ([long]$q)
            $ms = New-Object System.IO.MemoryStream
            $small.Save($ms, $codec, $params)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            if ($b64.Length -le 27000) { break }
          }
          # Annotations are the only output readable from outside: send the screenshot in chunks.
          $chunks = [math]::Ceiling($b64.Length / 3000)
          Write-Output "::notice title=shot-meta::${w}x${h} q=$q chunks=$chunks"
          for ($i = 0; $i -lt $chunks; $i++) {
            $part = $b64.Substring($i * 3000, [math]::Min(3000, $b64.Length - $i * 3000))
            Write-Output "::notice title=shot-$i::$part"
          }
          Stop-Process -Id $p.Id -Force

      # Drives identity creation and unlock in the installed app over CDP (WebView2 remote
      # debugging), with a virtual authenticator in place of Windows Hello. See the script.
      - name: Identity test in WebView2 (virtual authenticator)
        id: identity
        shell: pwsh
        timeout-minutes: 8
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "P2P Messenger"
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $env:APP_EXE = $exe.FullName
          $env:OUT_DIR = "desktop-test"
          node tests/desktop/webview2-identity.mjs

      # Only when the installed app's DevTools port could not be opened from outside: the same
      # app is rebuilt with the port in its window config (never shipped) and tested instead.
      - name: Identity test on a DevTools build (fallback)
        if: steps.identity.outputs.devtools == 'unavailable'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $win = $conf.app.windows[0]
          # wry's own defaults are replaced by this value, so they are repeated here.
          $win | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --autoplay-policy=no-user-gesture-required --remote-debugging-port=9222"
          $variant = Join-Path $env:RUNNER_TEMP "devtools-variant.json"
          @{ app = @{ windows = @($win) } } | ConvertTo-Json -Depth 10 | Out-File -Encoding utf8 $variant
          Get-Content $variant
          npx tauri build --no-bundle --config $variant
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:APP_EXE = (Resolve-Path src-tauri/target/release/p2p-messenger.exe).Path
          $env:DEVTOOLS_VIA = "config"
          $env:OUT_DIR = "desktop-test"
          node tests/desktop/webview2-identity.mjs

      - name: Identity test screenshot
        if: always()
        shell: pwsh
        run: |
          $file = "desktop-test/webview2-final.jpg"
          if (-not (Test-Path $file)) { Write-Output "::warning title=idshot-meta::no screenshot from the identity test"; exit 0 }
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file))
          $chunks = [math]::Ceiling($b64.Length / 3000)
          Write-Output "::notice title=idshot-meta::$((Get-Item $file).Length) bytes chunks=$chunks"
          for ($i = 0; $i -lt [math]::Min($chunks, 9); $i++) {
            $part = $b64.Substring($i * 3000, [math]::Min(3000, $b64.Length - $i * 3000))
            Write-Output "::notice title=idshot-$i::$part"
          }

      - name: winget manifests
        id: winget
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sha = (Get-FileHash out/P2P-Messenger-Setup-x64.exe -Algorithm SHA256).Hash
          if ($env:RELEASE_TAG) {
            if (-not $env:RELEASE_TAG.StartsWith("desktop-v")) { Write-Output "::error::release tag must start with desktop-v"; exit 1 }
            $tagVersion = $env:RELEASE_TAG.Substring("desktop-v".Length)
            if ($tagVersion -ne $version) { Write-Output "::error::tag $tagVersion does not match tauri.conf.json version $version"; exit 1 }
            $url = "https://github.com/${{ github.repository }}/releases/download/$($env:RELEASE_TAG)/P2P-Messenger-Setup-x64.exe"
          } else {
            # Manual runs have no release yet: the url is a placeholder, good for validation only.
            $url = "https://github.com/${{ github.repository }}/releases/download/desktop-v$version/P2P-Messenger-Setup-x64.exe"
          }
          $dir = node scripts/windows/winget-manifest.mjs --version $version --url $url --sha256 $sha --out winget
          Compress-Archive -Path winget/manifests -DestinationPath out/P2P-Messenger-winget-manifests.zip
          "dir=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Output "::notice title=winget-dir::$dir"

      - name: Validate manifests with winget
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -AllowClobber
            Repair-WinGetPackageManager -Latest -Force
            $env:PATH += ";$env:LOCALAPPDATA\Microsoft\WindowsApps"
          }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Output "::warning title=winget::winget is not available on this runner; manifests were not validated"
            exit 0
          }
          Write-Output "::notice title=winget-version::$(winget --version)"
          $result = winget validate --manifest "${{ steps.winget.outputs.dir }}" 2>&1 | Out-String
          $code = $LASTEXITCODE
          $text = ($result -replace "`r?`n", " | ").Trim()
          if ($code -ne 0) { Write-Output "::error title=winget-validate::code $code : $text"; exit 1 }
          Write-Output "::notice title=winget-validate-output::$text"
          Write-Output "::notice title=winget-validate::manifests are valid"

      - uses: actions/upload-artifact@v4
        with:
          name: p2p-messenger-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (release only)
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" out/* --target "${{ github.sha }}" --title "P2P Messenger for Windows $env:RELEASE_TAG" --notes-file docs/WINDOWS.md --prerelease

      - name: Install with winget from the release (release only)
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { $env:PATH += ";$env:LOCALAPPDATA\Microsoft\WindowsApps" }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { Write-Output "::warning::winget not available; install test skipped"; exit 0 }
          winget settings --enable LocalManifestFiles
          winget install --manifest "${{ steps.winget.outputs.dir }}" --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=winget-install::install from the release failed ($LASTEXITCODE)"; exit 1 }
          Write-Output "::notice title=winget-install::installed from the release through winget"

      - name: Submit to microsoft/winget-pkgs (tags only, needs WINGET_TOKEN)
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::notice title=winget-submit::WINGET_TOKEN is not set; not submitted. Manifests are attached to the release."
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN "${{ steps.winget.outputs.dir }}"
